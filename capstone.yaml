name: flyrank-capstone-widget-platform

run: docker compose up --build

seed: docker compose exec api python -m scripts.seed

test: pytest -q

base_url: http://localhost:8000

endpoints:
  - GET /health
  - POST /auth/login
  - POST /widgets
  - GET /widgets/{id}
  - PUT /widgets/{id}
  - DELETE /widgets/{id}
  - GET /widgets/{id}/config
  - GET /widget.v1.js
  - POST /submissions
  - GET /dashboard/submissions
  - GET /dashboard/stats
