services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://capstone:capstone@db:5432/capstone
      JWT_SECRET: change-this-before-production
      CORS_ORIGINS: http://localhost:5500
    ports:
      - "8000:8000"

volumes:
  postgres_data: